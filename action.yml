name: crosstalk merge gate
description: Enforce branch status and draft ancestry using a pinned crosstalk relay
inputs:
  mode:
    description: merge or advance (advance requires the ci:remote key)
    default: merge
  relay:
    description: Relay HTTPS origin
    required: true
  relay-key:
    description: Relay signing key fingerprint
    required: true
  space:
    description: Space UUID
    required: true
  key:
    description: CI credential
    required: true
  target:
    description: Target branch
    default: ${{ github.event.merge_group.base_ref || github.event.pull_request.base.ref || github.ref }}
  source:
    description: Source branch
    default: ${{ github.event.pull_request.head.ref }}
  head:
    description: Head or new commit
    default: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.event.after }}
  base:
    description: Base or old commit
    default: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci && npm run build
    - shell: bash
      env:
        XT_MODE: ${{ inputs.mode }}
        XT_EVENT: ${{ github.event_name }}
        CROSSTALK_KEY: ${{ inputs.key }}
        XT_RELAY: ${{ inputs.relay }}
        XT_RELAY_KEY: ${{ inputs.relay-key }}
        XT_SPACE: ${{ inputs.space }}
        XT_TARGET: ${{ inputs.target }}
        XT_SOURCE: ${{ inputs.source }}
        XT_HEAD: ${{ inputs.head }}
        XT_BASE: ${{ inputs.base }}
      run: |
        cd "$GITHUB_WORKSPACE"
        XT_TARGET="${XT_TARGET#refs/heads/}"
        args=(--relay "$XT_RELAY" --relay-key "$XT_RELAY_KEY" --space "$XT_SPACE")
        case "$XT_MODE" in
          merge)
            args+=(--target "$XT_TARGET" --head "$XT_HEAD" --base "$XT_BASE")
            if [[ "$XT_EVENT" != merge_group && -n "$XT_SOURCE" ]]; then
              args+=(--source "$XT_SOURCE")
            fi
            ;;
          advance)
            args+=(--ref "$XT_TARGET" --old "$XT_BASE" --new "$XT_HEAD")
            ;;
          *) echo "Invalid crosstalk mode" >&2; exit 1 ;;
        esac
        node "$GITHUB_ACTION_PATH/dist/cli/main.js" gate "$XT_MODE" "${args[@]}"
